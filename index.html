<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JTMK - Home</title>

  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
  <script>
    $(document).on("mobileinit", function () {
      $.mobile.ajaxEnabled = false;
    });
  </script>
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

  <style>
  :root {
    --primary-color: #17a2b8; 
    --secondary-color: #e0f2f7; 
    --text-color: #343a40;
    --accent-color: #6c757d; 
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--secondary-color);
    color: var(--text-color);
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .social-icons {
    position: fixed;
    top: 50%;
    left: 10px; 
    transform: translateY(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .social-icons a img {
    width: 35px; 
    height: 35px;
    border-radius: 5px;
    opacity: 0.8;
    transition: opacity 0.3s ease;
  }
  .social-icons a img:hover {
    opacity: 1;
  }

  .page-content {
    text-align: center;
    padding: 40px 20px; 
    flex-grow: 1; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .header-flex {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    width: 100%;
    padding: 15px 0;
    background-color: var(--primary-color);
    color: white;
  }
  .header-flex img {
    height: 50px; 
  }
  .header-flex h1 {
    margin: 0;
    font-size: 2em;
    color: white; 
  }

  .ui-navbar ul {
    background-color: darken(var(--primary-color), 10%);
    border: none;
  }
  .ui-navbar li a {
    color: black !important;
    text-shadow: none !important;
  }
  .ui-btn-active {
    background-color: var(--accent-color) !important;
    color: white !important;
    border: none !important;
  }

  .short-button {
    display: inline-block;
    background-color: var(--primary-color);
    color: white !important;
    font-size: 1.1em;
    padding: 12px 25px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    transition: background-color 0.3s ease, transform 0.2s ease-in-out;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-top: 20px;
  }
  .short-button:hover {
    background-color: darken(var(--primary-color), 10%);
    transform: scale(1.05);
  }
  .short-button:active {
    transform: scale(0.95);
  }

  h1 {
    color: var(--primary-color);
    font-size: 2.5em;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
  }

  p {
    font-size: 1.1em;
    line-height: 1.6;
    margin-bottom: 20px;
    color: var(--text-color);
  }

  [data-role="footer"] {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 15px 0;
    font-size: 0.9em;
  }
</style>
</head>

<body>
<div class="social-icons">
  <a href="https://www.linkedin.com/in/yourusername" target="_blank">
    <img src="img/linkedin.png" alt="LinkedIn">
  </a>
  <a href="https://github.com/yourusername" target="_blank">
    <img src="img/github.jpg" alt="GitHub">
  </a>
  <a href="https://twitter.com/yourusername" target="_blank">
    <img src="img/twitter.png" alt="Twitter">
  </a>
  <a href="https://www.youtube.com/@yourusername" target="_blank">
    <img src="img/youtube.jpg" alt="YouTube">
  </a>
  <a href="https://www.instagram.com/yourusername" target="_blank">
    <img src="img/instagram.jpg" alt="Instagram">
  </a>
</div>

<div data-role="page" id="home">

  <div data-role="header" data-position="fixed">
    <div class="header-flex">
      <img src="img/jtmk.jpg" alt="Logo">
      <h1>JTMK</h1>
    </div>
    <div data-role="navbar">
      <ul>
        <li><a href="index.html" class="ui-btn-active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="project.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>

  <div data-role="content" class="page-content">
    <h1>HEY, MY NAME IS JTMK</h1>
    <p>JTMK is the Department of Information and Communication Technology (JTMK) offering DDT courses at Seberang Perai Polytechnic (PSP).</p>

    <a href="project.html" class="short-button">PROJECTS</a>
  </div>

  <div data-role="footer" data-position="fixed">
    <h4>Copyright © DDT4B S2 2024/2025. All rights reserved.</h4>
  </div>

</div>
</body>
</html>
